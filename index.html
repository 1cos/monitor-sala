<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Monitor sala</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  .strato{position:absolute;inset:0;opacity:0;transition:opacity 1.5s ease-in-out}
  .strato.visibile{opacity:1}
  .strato img{width:100%;height:100%;object-fit:contain;display:block}
  .strato img.zoom{animation:zoom var(--durata,9.5s) linear forwards}
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.06)}}
  #info{position:absolute;left:24px;top:24px;padding:14px 18px;background:rgba(0,0,0,.78);color:#ffd84d;
        font:600 24px/1.45 system-ui,Arial,sans-serif;border-radius:10px;z-index:9;white-space:pre;max-width:90vw}
  #info.nascosto{display:none}
</style>
<script src="onoff.js"></script>
<script src="halloween.js"></script>
</head>
<body>
<div id="a" class="strato"></div>
<div id="b" class="strato"></div>
<div id="info"></div>
<script>
// Slideshow sala (STUPIDO S-05): 8 s per foto, zoom lento 6%, dissolvenza 1,5 s,
// una cheese wheel ogni 5 piatti, ordine casuale senza ripetizioni.
// ?video=1 aggiunge i video della cheese wheel (muti, mostrati per intero) al mazzo della cheese wheel.
// Le foto restano nella memoria del TV (sw.js). Il riquadro giallo mostra lo stato della memoria:
// visibile solo con ?info=1; tasto OK/Invio o "i" per mostrarlo/nasconderlo.
const q=new URLSearchParams(location.search);
const entro=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);   // mai bloccare lo slideshow
const SEC=+(q.get("sec")||8), OGNI=+(q.get("ogni")||5), VIDEO=false;   // decisione Max 22/10: per ora SOLO FOTO, i video si riaccendono più avanti
const MEDIA="media-v1";
const info=document.getElementById("info");
let infoFissa=q.get("info")==="1";
if(!infoFissa) info.classList.add("nascosto");   // per i clienti nessuna scritta: il riquadro solo con ?info=1 (o tasto OK)

const stato={sw:"?",persist:"?",spazio:"?",salvate:0,totale:0,primo:"?",browser:"",nomi:new Set()};
function scriviInfo(){
  info.textContent=
    `MONITOR SALA · prova memoria\n`+
    `File salvati nel TV: ${stato.salvate} su ${stato.totale}  (mancano ${Math.max(0,stato.totale-stato.salvate)})${VIDEO?" · con video":" · solo foto"}\n`+
    `Salvataggio automatico (Service Worker): ${stato.sw}\n`+
    `Memoria permanente: ${stato.persist}\n`+
    `Spazio: ${stato.spazio}\n`+
    `Primo salvataggio: ${stato.primo}\n`+
    `Schermo: ${Math.round(screen.width*(devicePixelRatio||1))}×${Math.round(screen.height*(devicePixelRatio||1))}\n`+
    `${stato.browser}`;
}
stato.browser=(navigator.userAgent||"").replace(/\s*\(KHTML, like Gecko\)/,"").slice(0,110);

async function memoria(){
  if("serviceWorker" in navigator){
    try{ const pr=navigator.serviceWorker.register("sw.js"); pr.then(()=>{stato.sw="SÌ";scriviInfo();}).catch(e=>{stato.sw="NO ("+e.name+")";}); const reg=await entro(pr,8000); stato.sw=reg?"SÌ":"in attesa"; }catch(e){ stato.sw="NO ("+e.name+")"; }
  } else stato.sw="NO (non supportato)";
  if(navigator.storage&&navigator.storage.persist){
    try{ const ok=(await entro(navigator.storage.persisted(),3000))||(await entro(navigator.storage.persist(),5000)); stato.persist=ok?"SÌ":"NO"; }catch(e){ stato.persist="NO"; }
  } else stato.persist="non supportata";
  try{ let p=localStorage.getItem("primo_salvataggio"); if(!p){p=new Date().toLocaleString("it-IT");localStorage.setItem("primo_salvataggio",p);} stato.primo=p; }catch(e){ stato.primo="non disponibile"; }
}
async function contaSalvate(){
  try{
    if("caches" in window){ const c=await caches.open(MEDIA); const k=await c.keys(); stato.salvate=k.filter(r=>stato.nomi.has(new URL(r.url).pathname.split("/").slice(-2).join("/"))).length; }
    if(navigator.storage&&navigator.storage.estimate){ const s=await navigator.storage.estimate();
      stato.spazio=`usati ${(s.usage/1e6).toFixed(0)} MB su ${(s.quota/1e6).toFixed(0)} MB concessi`; }
  }catch(e){}
  scriviInfo();
}
// Scarica in sottofondo, una alla volta, le foto non ancora salvate (passano dal Service Worker).
async function riempiMemoria(tutte){
  if(!("caches" in window)) return;
  const c=await caches.open(MEDIA);
  for(const f of tutte){
    if(await c.match(new URL(f,location.href).href)) continue;
    try{ const r=await fetch(f); if(r.ok&&!(navigator.serviceWorker&&navigator.serviceWorker.controller)) await c.put(f,r); }catch(e){ await new Promise(r=>setTimeout(r,30000)); }
    if(Math.random()<0.1) contaSalvate();
  }
  contaSalvate();
}

function mescola(l){l=l.slice();for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}return l}
let lista,mazzoP=[],mazzoR=[],contaP=0;
function prossimo(){
  if(contaP>=OGNI&&lista.ruota.length){ contaP=0; if(!mazzoR.length) mazzoR=mescola(lista.ruota); return mazzoR.pop(); }
  contaP++; if(!mazzoP.length) mazzoP=mescola(lista.piatti); return mazzoP.pop();
}
const strati=[document.getElementById("a"),document.getElementById("b")]; let sopra=0;
function avanti(){
  const nome=prossimo(); if(!nome) return;
  const s=strati[1-sopra]; s.innerHTML="";
  const mostra=()=>{ s.classList.add("visibile"); strati[sopra].classList.remove("visibile"); sopra=1-sopra; };
  if(/\.mp4$/.test(nome)){
    // video: letto dalla memoria come file intero (blob), così il TV non lo riscarica a pezzi
    fetch(nome).then(r=>{ if(!r.ok) throw 0; return r.blob(); }).then(b=>{
      const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.autoplay=true;
      const u=URL.createObjectURL(b); v.src=u;
      v.oncanplay=()=>{ v.oncanplay=null; mostra(); v.play().catch(()=>{}); };
      const fine=()=>{ URL.revokeObjectURL(u); avanti(); }; let finito=false;
      v.onended=()=>{ if(!finito){finito=true; fine();} }; setTimeout(()=>{ if(!finito){finito=true; fine();} },20000);
      v.onerror=()=>{ if(!finito){finito=true; setTimeout(fine,500);} };
      s.appendChild(v);
    }).catch(()=>setTimeout(avanti,2000));
    return;
  }
  const img=new Image();
  img.onload=()=>{ img.style.setProperty("--durata",(SEC+1.5)+"s"); img.classList.add("zoom"); mostra(); setTimeout(avanti,SEC*1000); };
  img.onerror=()=>setTimeout(avanti,2000);   // foto non raggiungibile: si passa alla prossima
  img.src=nome; s.appendChild(img);
}
document.addEventListener("keydown",e=>{ if(["i","Enter"," "].includes(e.key)) info.classList.toggle("nascosto"); });

(async()=>{
  scriviInfo();
  lista=await (await fetch("lista.json",{cache:"no-cache"})).json();
  if(VIDEO&&lista.video) lista.ruota=[...lista.ruota,...lista.video];
  const tutte=[...lista.piatti,...lista.ruota]; stato.totale=tutte.length; stato.nomi=new Set(tutte);
  avanti();
  await entro(memoria(),10000); await contaSalvate();
  if(navigator.serviceWorker) await entro(navigator.serviceWorker.ready,10000);
  riempiMemoria(tutte);
  setInterval(contaSalvate,15000);
})();
</script>
</body>
</html>
